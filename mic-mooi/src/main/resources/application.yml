spring:
  application:
    name: ${APP_NAME:mic-mooi}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:54983}/${POSTGRES_DB:mooi}
    username: ${POSTGRES_USER:mooi}
    password: ${POSTGRES_PASSWORD:change-me}
    hikari:
      pool-name: mooi-pool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    enabled: ${DB_MIGRATIONS_ENABLED:true}
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: ${POSTGRES_SCHEMA:public}

server:
  port: ${SERVER_PORT:39615}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    dev.mooi.mic: ${LOG_LEVEL_APP:INFO}
    auth: ${LOG_LEVEL_AUTH:INFO}
    github: ${LOG_LEVEL_GITHUB:INFO}
    agents: ${LOG_LEVEL_AGENTS:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId:-}] [%X{playerId:-}] %logger{36} - %msg%n"

app:
  version: ${APP_VERSION:0.1.0}
  cors:
    allowed-origins: ${CORS_ORIGIN:http://localhost:28471}
  crypto:
    secrets-key: ${SECRETS_KEY:}
  service:
    token: ${SERVICE_TOKEN:}
  auth:
    google-client-id: ${GOOGLE_CLIENT_ID:}
    google-jwks-uri: ${GOOGLE_JWKS_URI:https://www.googleapis.com/oauth2/v3/certs}
    jwt-secret: ${JWT_SECRET:}
    access-token-expires-in: ${ACCESS_TOKEN_EXPIRES_IN:15m}
    refresh-token-expires-in: ${REFRESH_TOKEN_EXPIRES_IN:30d}
    # Optional absolute ceiling from the session's creation; blank = none (an active player never signs in again).
    session-max-lifetime: ${SESSION_MAX_LIFETIME:}
    refresh-token-purge-cron: ${REFRESH_TOKEN_PURGE_CRON:0 30 3 * * *}
    replay-grace-seconds: ${REPLAY_GRACE_SECONDS:30}
    refresh-cookie:
      name: ${AUTH_REFRESH_COOKIE_NAME:mooi_refresh}
      # Public path of the auth endpoints behind the gateway; the preview proxy re-roots it per preview.
      path: ${AUTH_REFRESH_COOKIE_PATH:/api/mooi/auth}
      secure: ${AUTH_REFRESH_COOKIE_SECURE:true}
    # Transition only: accept and return the refresh token in JSON bodies (pre-cookie clients). Remove later.
    legacy-body-token-enabled: ${AUTH_LEGACY_BODY_TOKEN_ENABLED:true}
    admin-emails: ${ADMIN_EMAILS:}
    # Development only (Mooi session previews): sign in as a fixed player without Google.
    google-mock:
      enabled: ${AUTH_GOOGLE_MOCK_ENABLED:false}
      email: ${AUTH_GOOGLE_MOCK_EMAIL:developer@mooi.dev}
      # Accounts linked to the mocked player at boot; each one is optional. Long-lived, non-rotating
      # credentials only (see MockAccountsFeature): never copy a production refresh token here.
      github-token: ${AUTH_GOOGLE_MOCK_GITHUB_TOKEN:}
      claude-token: ${AUTH_GOOGLE_MOCK_CLAUDE_TOKEN:}
      codex-auth-json: ${AUTH_GOOGLE_MOCK_CODEX_AUTH_JSON:}
  github:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    app-slug: ${GITHUB_APP_SLUG:}
    redirect-uri: ${GITHUB_REDIRECT_URI:}
    authorize-uri: ${GITHUB_AUTHORIZE_URI:https://github.com/login/oauth/authorize}
    token-uri: ${GITHUB_TOKEN_URI:https://github.com/login/oauth/access_token}
    api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
    state-expires-in: ${GITHUB_STATE_EXPIRES_IN:10m}
    token-refresh-skew: ${GITHUB_TOKEN_REFRESH_SKEW:5m}
    request-timeout-ms: ${GITHUB_REQUEST_TIMEOUT_MS:10000}
  agents:
    state-expires-in: ${AGENT_STATE_EXPIRES_IN:10m}
    # Claude sign-in tokens live 8h; renewing 1h early lets a turn started on one finish on it.
    token-refresh-skew: ${AGENT_TOKEN_REFRESH_SKEW:1h}
    request-timeout-ms: ${AGENT_REQUEST_TIMEOUT_MS:10000}
    claude:
      # Offers the Claude Code sign-in; false falls back to pasting a `claude setup-token` token.
      enabled: ${AGENT_CLAUDE_ENABLED:true}
